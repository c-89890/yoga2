<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Yoga Coach · 实时瑜伽姿态检测</title>
<link rel="manifest" href="./manifest.json">
<style>
  :root{
    --bg:#071510; --card:#0d2018; --line:#1b3a2c; --fg:#dff3e8; --dim:#7fa694;
    --ok:#3ddc97; --warn:#ffb020; --bad:#ff5d5d;
    --grad-a:#1f6f4a; --grad-b:#2fae74;
    --stage:#ffffff; --splash:rgba(7,21,16,.94); --hud:rgba(7,21,16,.62);
    --cue-bg:rgba(255,176,32,.16); --cue-fg:#ffdca8; --cue-border:#ffb020;
    --overlay:rgba(3,8,6,.78);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    overscroll-behavior:none;transition:background .3s,color .3s}
  body{display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:8px;padding:10px 14px;
    border-bottom:1px solid var(--line);background:var(--card)}
  header h1{font-size:15px;margin:0;font-weight:600}
  header .dot{width:8px;height:8px;border-radius:50%;background:var(--bad)}
  header .dot.on{background:var(--ok)}
  header .user{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
  header .user button{padding:6px 10px;font-size:12px}
  .avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--grad-a),var(--grad-b));color:#04120c;
    font-size:14px;font-weight:700;background-size:cover;background-position:center;
    border:1px solid var(--line);overflow:hidden;flex:0 0 auto}
  main{flex:1;display:flex;flex-direction:column;min-height:0}
  .stage{position:relative;flex:1;background:var(--stage);overflow:hidden;min-height:0}
  #video,#overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #video{transform:scaleX(-1)}
  #overlay{transform:scaleX(-1);pointer-events:none}
  .hud{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
  .score-card{display:flex;align-items:baseline;gap:6px;background:var(--hud);
    backdrop-filter:blur(8px);padding:6px 14px;border-radius:14px;border:1px solid var(--line)}
  .grade{font-size:13px;color:var(--dim)}
  .num{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ok)}
  .unit{font-size:12px;color:var(--dim)}
  .hold,.fps{font-size:12px;color:var(--fg);background:var(--hud);padding:3px 9px;border-radius:9px;width:max-content}
  .cues{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
  .cue{background:var(--cue-bg);border-left:3px solid var(--cue-border);color:var(--cue-fg);
    padding:7px 11px;border-radius:8px;font-size:13px;backdrop-filter:blur(6px)}
  .pose-card{position:absolute;right:12px;top:12px;width:158px;background:var(--hud);
    backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;
    padding:10px 11px;font-size:12px;pointer-events:none}
  .pose-card[hidden]{display:none}
  .pose-card img{width:100%;border-radius:8px;display:none;margin-bottom:6px;
    background:#fff;object-fit:contain;max-height:110px}
  .pose-card b{display:block;font-size:12.5px;color:var(--ok);margin-bottom:6px}
  .pose-card ul{margin:0;padding-left:15px;color:var(--dim);line-height:1.65}
  .pose-card li{margin-bottom:2px}
  .splash{position:absolute;inset:0;display:grid;place-items:center;background:var(--splash);
    transition:opacity .35s;padding:20px;text-align:center}
  .splash.hide{opacity:0;pointer-events:none}
  .splash h2{margin:0 0 8px;font-size:19px;color:var(--fg)}
  .splash p{color:var(--dim);margin:6px 0;font-size:13px}
  button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);
    border-radius:11px;padding:9px 14px;cursor:pointer;transition:.15s}
  button:active{transform:scale(.97)}
  button.primary{background:linear-gradient(135deg,var(--grad-a),var(--grad-b));
    border-color:var(--grad-b);font-weight:600;padding:11px 26px;margin-top:14px;color:#04120c}
  button.on{border-color:var(--ok);color:var(--ok)}
  button:disabled{opacity:.5}
  .panel{border-top:1px solid var(--line);padding:10px 12px max(10px,env(safe-area-inset-bottom));
    background:var(--card);display:flex;flex-direction:column;gap:9px;max-height:42vh;overflow:auto}
  .row{display:flex;align-items:center;gap:8px}
  .row label{color:var(--dim);font-size:12px;white-space:nowrap}
  select{flex:1;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);
    border-radius:10px;padding:9px 10px}
  .btns button{flex:1;font-size:12.5px;padding:8px 6px}
  .rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .rule{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--dim)}
  .rule .bar{flex:0 0 54px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
  .rule .bar i{display:block;height:100%;width:0;background:var(--dim);transition:width .18s}
  .rule.ok .bar i{background:var(--ok)} .rule.ok{color:var(--ok)}
  .rule.warn .bar i{background:var(--warn)} .rule.warn{color:var(--warn)}
  .rule.bad .bar i{background:var(--bad)} .rule.bad{color:var(--bad)}
  .hr{font-size:12.5px;color:var(--bad)}
  @media(min-width:900px){
    main{flex-direction:row}
    .stage{flex:1}
    .panel{width:320px;max-height:none;border-top:none;border-left:1px solid var(--line)}
  }
  .stat{font-size:12.5px;color:var(--dim);padding:2px 2px}
  .suggest{font-size:12.5px;background:var(--cue-bg);border:1px solid var(--cue-border);
    color:var(--cue-fg);padding:8px 10px;border-radius:10px;cursor:pointer}

  .drawer{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;padding:14px}
  .drawer[hidden]{display:none}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;
    padding-bottom:10px;border-bottom:1px solid var(--line)}
  .drawer-body{flex:1;overflow:auto;display:grid;gap:12px;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));padding:12px 0}
  .drawer-body .empty{grid-column:1/-1;color:var(--dim);font-size:13px;text-align:center;padding:40px 0}
  .snap{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;cursor:pointer;transition:.15s}
  .snap:active{transform:scale(.98)}
  .snap img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}
  .snap figcaption{display:flex;flex-direction:column;gap:2px;padding:9px;font-size:12px;color:var(--dim)}
  .snap figcaption b{font-size:16px}
  .drawer-foot{padding-top:10px;border-top:1px solid var(--line)}
  .drawer-foot button{width:100%;padding:10px;color:var(--bad);border-color:var(--line)}

  .viewer{position:fixed;inset:0;z-index:90;background:#000;display:flex;flex-direction:column}
  .viewer[hidden]{display:none}
  .viewer-bar{display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;background:rgba(0,0,0,.7);color:#fff}
  .viewer-bar b{font-size:17px;color:var(--ok)}
  .viewer-bar button{width:auto;padding:4px 12px;background:transparent;
    border:1px solid rgba(255,255,255,.3);color:#fff}
  .viewer-img-wrap{flex:1;min-height:0;background:#000;display:grid;place-items:center;overflow:hidden}
  .viewer-img-wrap img{max-width:100%;max-height:100%;object-fit:contain}
  .viewer-info{padding:14px 16px calc(18px + env(safe-area-inset-bottom));
    background:var(--card);max-height:42vh;overflow:auto}
  .v-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);margin-bottom:8px}
  #vCues{margin:0;padding-left:16px;color:var(--cue-fg);font-size:13px;line-height:1.7}
  #vCues li{margin-bottom:4px}
  .v-btns{display:flex;gap:10px;margin-top:14px}
  .v-btns button{flex:1;padding:11px;border-radius:10px}
  #vSave{background:linear-gradient(135deg,var(--grad-a),var(--grad-b));border:0;
    color:#04120c;font-weight:600}
  #vDel{background:var(--bg);border:1px solid var(--line);color:var(--bad)}

  .toast{position:fixed;left:50%;bottom:80px;transform:translate(-50%,10px);opacity:0;
    background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:12px;
    font-size:13px;pointer-events:none;transition:.25s;z-index:95;max-width:80vw}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  .modal{position:fixed;inset:0;z-index:70;background:var(--overlay);display:grid;
    place-items:center;padding:20px;backdrop-filter:blur(4px)}
  .modal[hidden]{display:none}
  .modal-card{width:100%;max-width:360px;max-height:90vh;display:flex;flex-direction:column;
    overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:16px}
  .modal-head{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
    padding:16px 20px;border-bottom:1px solid var(--line);background:var(--card)}
  .modal-head button{width:auto;margin:0;padding:4px 12px}
  .modal-body{flex:1 1 auto;overflow-y:auto;padding:12px 20px 20px}
  .modal-body label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px}
  .modal-body input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);
    background:var(--bg);color:var(--fg);font:inherit}
  .modal-body > button{width:100%;margin-top:14px;padding:11px;border-radius:10px;
    background:linear-gradient(135deg,var(--grad-a),var(--grad-b));border:0;font-weight:600;color:#04120c}
  .modal-body hr{border:0;border-top:1px solid var(--line);margin:20px 0 4px}
  .switch-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-size:13px}
  .switch-row input{width:auto;margin:0;transform:scale(1.2)}
  .avatar-block{display:flex;align-items:center;gap:14px}
  .avatar-lg{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--grad-a),var(--grad-b));color:#04120c;
    font-size:26px;font-weight:700;background-size:cover;background-position:center;
    border:1px solid var(--line);overflow:hidden;flex:0 0 auto}
  .avatar-actions{display:flex;flex-direction:column;gap:6px;flex:1}
  .avatar-actions button{margin:0;padding:9px;font-size:12.5px}
  .avatar-actions .ghost{background:var(--bg);border:1px solid var(--line);color:var(--dim)}
  .swatches{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 22px}
  .swatch{width:40px;height:40px;border-radius:12px;cursor:pointer;border:2px solid transparent;
    transition:.18s;position:relative}
  .swatch.active{border-color:var(--fg)}
  .swatch span{position:absolute;top:44px;left:50%;transform:translateX(-50%);
    font-size:10px;color:var(--dim);white-space:nowrap}
  @media (max-width: 899px){
    .panel{max-height:28vh;gap:6px;padding:8px 10px}
    .rules{display:none}
    .num{font-size:26px}
    .pose-card{width:118px;font-size:11px;padding:8px 9px}
    .pose-card img{max-height:78px}
    .drawer-body{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>Yoga Coach · 实时姿态检测</h1>
  <div class="user">
    <span class="avatar" id="avatar">?</span>
    <span id="userName">—</span>
    <button id="profileBtn">⚙️</button>
    <button id="logoutBtn">退出</button>
  </div>
</header>

<main>
  <div class="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>

    <div class="hud" id="hud">
      <div class="score-card">
        <span class="grade" id="grade">--</span>
        <span class="num" id="score">0</span><span class="unit">分</span>
      </div>
      <div class="hold" id="hold">保持 0.0s</div>
      <div class="fps" id="fps">-- fps</div>
    </div>

    <div class="pose-card" id="poseCard">
      <img id="poseImg" alt="">
      <b id="poseCardName">动作</b>
      <ul id="poseCardTips"></ul>
    </div>

    <div class="cues" id="cues"></div>

    <div class="splash" id="splash">
      <div>
        <h2>开始你的练习</h2>
        <p>把手机/电脑放在 1.5~2.5 米处，确保全身入镜</p>
        <p>正面或侧身站立，光线均匀，背景尽量干净</p>
        <button class="primary" id="startBtn">开启摄像头</button>
        <p id="splashHint"></p>
      </div>
    </div>
  </div>

  <aside class="panel">
    <div class="row">
      <label for="poseSelect">动作</label>
      <select id="poseSelect"></select>
    </div>
    <div class="row btns">
      <button id="castBtn">📺 投屏</button>
      <button id="bleBtn">❤️ 心率带</button>
      <button id="flipBtn">🔄 镜头</button>
    </div>
    <div class="row btns">
      <button id="snapBtn">📸 定格</button>
      <button id="autoSnapBtn">🤖 自动</button>
      <button id="voiceBtn" class="on">🔊 语音</button>
      <button id="galleryBtn">🖼 记录</button>
    </div>
    <div class="row">
      <label for="qualitySel">精度</label>
      <select id="qualitySel">
        <option value="speed">流畅（lite · 640p）</option>
        <option value="balanced" selected>均衡（lite · 960p）</option>
        <option value="accurate">精细（full · 1280p）</option>
      </select>
    </div>
    <div class="stat" id="statLine">—</div>
    <div class="suggest" id="suggest" hidden></div>

    <ul class="rules" id="ruleList"></ul>
    <div class="hr" id="hrBox" hidden>心率：<b id="hr">--</b> bpm</div>
  </aside>

  <div class="drawer" id="gallery" hidden>
    <div class="drawer-head">
      <b>定格记录</b>
      <button id="galleryClose">关闭</button>
    </div>
    <div class="drawer-body" id="galleryList"></div>
    <div class="drawer-foot"><button id="galleryClear">清空全部</button></div>
  </div>

  <div class="viewer" id="viewer" hidden>
    <div class="viewer-bar">
      <b id="vScore">-- 分</b>
      <button id="vClose">✕</button>
    </div>
    <div class="viewer-img-wrap">
      <img id="vImg" alt="">
    </div>
    <div class="viewer-info">
      <div class="v-row"><span id="vPose">—</span><span id="vTime">—</span></div>
      <ul id="vCues"></ul>
      <div class="v-btns">
        <button id="vSave">保存图片</button>
        <button id="vDel">删除</button>
      </div>
    </div>
  </div>

  <div class="modal" id="profileModal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <b>个人资料 / 设置</b>
        <button id="profileClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="avatar-block">
          <div class="avatar-lg" id="avatarLg">?</div>
          <div class="avatar-actions">
            <button id="pickAvatar">更换头像</button>
            <button id="removeAvatar" class="ghost">移除头像</button>
          </div>
          <input type="file" id="avatarFile" accept="image/*" hidden>
        </div>

        <label>昵称</label>
        <input id="pNick">
        <label>性别</label>
        <select id="pGender"><option value="F">女</option><option value="M">男</option></select>
        <label>年龄</label>
        <input id="pAge" type="number">
        <label>身高（cm）</label>
        <input id="pHeight" type="number" step="0.1">
        <label>体重（kg）</label>
        <input id="pWeight" type="number" step="0.1">
        <button id="saveProfile">保存资料</button>

        <hr>
        <label>页面主题</label>
        <div class="swatches" id="swatches"></div>

        <hr>
        <label>显示选项</label>
        <div class="switch-row">
          <span>显示分数与帧率</span>
          <input type="checkbox" id="showScore" checked>
        </div>
        <div class="switch-row">
          <span>显示右上角动作要点</span>
          <input type="checkbox" id="showPoseCard" checked>
        </div>

        <hr>
        <label>原密码</label>
        <input id="pOld" type="password">
        <label>新密码</label>
        <input id="pNew" type="password">
        <button id="savePass">修改密码</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
