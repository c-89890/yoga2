<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>登录 · Yoga Coach</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;color:#e9eef5;
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#070b10}
  .bg{position:fixed;inset:0;overflow:hidden}
  .bg::before,.bg::after{content:"";position:absolute;border-radius:50%;filter:blur(80px);opacity:.42}
  .bg::before{width:520px;height:520px;background:#1f8f63;top:-150px;left:-120px}
  .bg::after{width:460px;height:460px;background:#2a5fa8;bottom:-170px;right:-110px}
  .wrap{position:relative;height:100%;display:grid;place-items:center;padding:24px;overflow:auto}
  .card{width:100%;max-width:380px;background:rgba(20,26,34,.82);
    backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.08);
    border-radius:20px;padding:28px 26px 24px;box-shadow:0 24px 60px rgba(0,0,0,.55)}
  .logo{width:56px;height:56px;border-radius:16px;margin:0 auto 14px;display:grid;place-items:center;
    background:linear-gradient(135deg,#1f6f4a,#3ddc97);font-size:26px}
  h1{font-size:20px;margin:0 0 4px;text-align:center}
  .sub{color:#8fa1b5;font-size:13px;text-align:center;margin:0 0 22px}
  .tabs{display:flex;background:#0d131a;border-radius:12px;padding:4px;margin-bottom:20px}
  .tab{flex:1;text-align:center;padding:9px;border-radius:9px;font-size:14px;
    color:#8fa1b5;cursor:pointer;transition:.2s;user-select:none}
  .tab.active{background:#1b2634;color:#e9eef5;font-weight:600}
  .pane[hidden]{display:none}
  label{display:block;font-size:12.5px;color:#8fa1b5;margin:0 0 6px}
  .field{margin-bottom:14px}
  input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #26313f;
    background:#0d131a;color:#e9eef5;font:inherit;transition:.2s}
  input:focus{outline:none;border-color:#3ddc97;box-shadow:0 0 0 3px rgba(61,220,151,.14)}
  .pw-wrap{position:relative}
  .pw-wrap input{padding-right:46px}
  .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:36px;height:36px;padding:0;display:grid;place-items:center;
    background:transparent;border:0;color:#8fa1b5;font-size:16px;cursor:pointer;
    border-radius:8px;margin:0;transition:.15s}
  .eye:hover{color:#e9eef5}
  button{width:100%;padding:13px;border:0;border-radius:12px;font:inherit;font-weight:600;
    cursor:pointer;transition:.18s;color:#04120c;
    background:linear-gradient(135deg,#1f6f4a,#3ddc97)}
  button:active{transform:scale(.985)}
  button:disabled{opacity:.6;cursor:default}
  .msg{min-height:20px;margin-top:12px;font-size:13px;text-align:center;color:#ff8f8f}
  .msg.ok{color:#3ddc97}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <div class="card">
    <div class="logo">🧘</div>
    <h1>Yoga Coach</h1>
    <p class="sub">实时瑜伽姿态检测</p>

    <div class="tabs">
      <div class="tab active" data-tab="login">登录</div>
      <div class="tab" data-tab="register">注册</div>
    </div>

    <form class="pane" id="loginPane">
      <div class="field">
        <label>账号</label>
        <input id="uName" autocomplete="username" placeholder="请输入账号" required>
      </div>
      <div class="field">
        <label>密码</label>
        <div class="pw-wrap">
          <input id="uPass" type="password" autocomplete="current-password" placeholder="请输入密码" required>
          <button type="button" class="eye" data-for="uPass" aria-label="显示密码">👁</button>
        </div>
      </div>
      <button type="submit" id="loginBtn">登 录</button>
      <div class="msg" id="loginMsg"></div>
    </form>

    <form class="pane" id="registerPane" hidden>
      <div class="field">
        <label>账号</label>
        <input id="rName" autocomplete="username" placeholder="3 个字符以上" required>
      </div>
      <div class="field">
        <label>昵称（可选）</label>
        <input id="rNick" placeholder="显示用的名字">
      </div>
      <div class="field">
        <label>密码</label>
        <div class="pw-wrap">
          <input id="rPass" type="password" autocomplete="new-password" placeholder="至少 6 位" required>
          <button type="button" class="eye" data-for="rPass" aria-label="显示密码">👁</button>
        </div>
      </div>
      <div class="field">
        <label>确认密码</label>
        <div class="pw-wrap">
          <input id="rPass2" type="password" autocomplete="new-password" placeholder="再输入一次" required>
          <button type="button" class="eye" data-for="rPass2" aria-label="显示密码">👁</button>
        </div>
      </div>
      <button type="submit" id="regBtn">注 册</button>
      <div class="msg" id="regMsg"></div>
    </form>
  </div>
</div>

<script type="module">
import { currentUser, login, register } from "./src/api.js";

if (currentUser()) location.replace("./index.html");

const tabs = document.querySelectorAll(".tab");
const loginPane = document.getElementById("loginPane");
const registerPane = document.getElementById("registerPane");

tabs.forEach(t => t.addEventListener("click", () => {
  tabs.forEach(x => x.classList.toggle("active", x === t));
  const isLogin = t.dataset.tab === "login";
  loginPane.hidden = !isLogin;
  registerPane.hidden = isLogin;
}));

document.querySelectorAll(".eye").forEach(btn => {
  btn.addEventListener("click", () => {
    const inp = document.getElementById(btn.dataset.for);
    const show = inp.type === "password";
    inp.type = show ? "text" : "password";
    btn.textContent = show ? "🙈" : "👁";
  });
});

loginPane.addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("loginMsg");
  const btn = document.getElementById("loginBtn");
  const name = document.getElementById("uName").value.trim();
  const pass = document.getElementById("uPass").value;
  if (!name || !pass) { msg.textContent = "请输入账号和密码"; return; }

  btn.disabled = true;
  msg.className = "msg";
  msg.textContent = "登录中…";
  try {
    const u = await login(name, pass);
    msg.className = "msg ok";
    msg.textContent = `欢迎 ${u.nick_name || u.username}`;
    setTimeout(() => location.replace("./index.html"), 400);
  } catch (err) {
    msg.textContent = err.message || "登录失败";
    btn.disabled = false;
  }
});

registerPane.addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("regMsg");
  const btn = document.getElementById("regBtn");
  const name = document.getElementById("rName").value.trim();
  const nick = document.getElementById("rNick").value.trim();
  const p1 = document.getElementById("rPass").value;
  const p2 = document.getElementById("rPass2").value;

  if (name.length < 3) { msg.textContent = "账号至少 3 个字符"; return; }
  if (p1.length < 6) { msg.textContent = "密码至少 6 位"; return; }
  if (p1 !== p2) { msg.textContent = "两次输入的密码不一致"; return; }

  btn.disabled = true;
  msg.className = "msg";
  msg.textContent = "注册中…";
  try {
    await register(name, p1, nick);
    msg.className = "msg ok";
    msg.textContent = "注册成功，正在登录…";
    await login(name, p1);
    setTimeout(() => location.replace("./index.html"), 500);
  } catch (err) {
    msg.textContent = err.message || "注册失败";
    btn.disabled = false;
  }
});
</script>
</body>
</html>
