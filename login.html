<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>登录 · Yoga Coach</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;color:#e6eef8;
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#071a33 0%,#040a14 55%,#02060c 100%)}
  .page{height:100%;display:flex;flex-direction:column;overflow-y:auto;
    padding:32px 24px calc(24px + env(safe-area-inset-bottom))}
  .hero{flex:0 0 auto;margin-bottom:26px}
  .logo{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;
    background:linear-gradient(135deg,#2b7bd6,#0b4f9e);font-size:30px;
    box-shadow:0 8px 24px rgba(20,90,180,.45);margin-bottom:20px}
  h1{font-size:24px;margin:0 0 10px;font-weight:700;letter-spacing:.5px;line-height:1.35}
  .meta{color:#7d93ad;font-size:13px;margin:2px 0}
  .meta b{color:#9fb6cf;font-weight:500}
  .card{flex:0 0 auto;background:rgba(16,32,52,.72);border:1px solid rgba(70,130,200,.22);
    border-radius:18px;padding:24px 22px;backdrop-filter:blur(14px);
    box-shadow:0 18px 44px rgba(0,0,0,.42)}
  .card h2{font-size:18px;margin:0 0 8px;font-weight:700;line-height:1.5}
  .hint{color:#7d93ad;font-size:12.5px;margin:0 0 20px;line-height:1.7}
  .tabs{display:flex;background:rgba(8,18,32,.8);border-radius:12px;padding:4px;margin-bottom:20px}
  .tab{flex:1;text-align:center;padding:9px;border-radius:9px;font-size:14px;
    color:#7d93ad;cursor:pointer;transition:.2s;user-select:none}
  .tab.active{background:#16395f;color:#e6eef8;font-weight:600}
  .pane[hidden]{display:none}
  label{display:block;font-size:12.5px;color:#8aa0b8;margin:0 0 6px}
  .field{margin-bottom:14px}
  input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(70,120,180,.3);
    background:rgba(6,16,28,.9);color:#e6eef8;font:inherit;transition:.2s}
  input:focus{outline:none;border-color:#2b7bd6;box-shadow:0 0 0 3px rgba(43,123,214,.18)}
  .pw-wrap{position:relative}
  .pw-wrap input{padding-right:46px}
  .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:36px;height:36px;padding:0;display:grid;place-items:center;
    background:transparent;border:0;color:#7d93ad;font-size:16px;cursor:pointer;
    border-radius:8px;margin:0}
  .eye:hover{color:#e6eef8}
  button{width:100%;padding:14px;border:0;border-radius:12px;font:inherit;
    font-weight:600;cursor:pointer;transition:.18s;color:#fff;
    background:linear-gradient(135deg,#2b7bd6,#0b4f9e);
    box-shadow:0 6px 18px rgba(20,90,180,.35)}
  button:active{transform:scale(.985)}
  button:disabled{opacity:.6;cursor:default}
  .msg{min-height:20px;margin-top:12px;font-size:13px;text-align:center;color:#ff8f8f}
  .msg.ok{color:#5fd39c}
  .foot{flex:0 0 auto;margin-top:auto;padding-top:26px;text-align:center;
    color:#5f7a95;font-size:12.5px}
  .foot span{margin:0 10px}
</style>
</head>
<body>
<div class="page">
  <div class="hero">
    <div class="logo">🧘</div>
    <h1>Yoga Coach</h1>
    <p class="meta">实时瑜伽姿态检测 · <b>v1.0</b></p>
    <p class="meta">技术支持：AI 骨骼识别 · 动作打分 · 语音纠错</p>
  </div>

  <div class="card">
    <h2>登录瑜伽姿态检测平台</h2>
    <p class="hint">账号只保存在当前设备浏览器中，首次使用请先注册</p>

    <div class="tabs">
      <div class="tab active" data-tab="login">登录</div>
      <div class="tab" data-tab="register">注册</div>
    </div>

    <form class="pane" id="loginPane">
      <div class="field">
        <label>账号</label>
        <input id="uName" autocomplete="username" placeholder="请输入账号" required>
      </div>
      <div class="field">
        <label>密码</label>
        <div class="pw-wrap">
          <input id="uPass" type="password" autocomplete="current-password" placeholder="请输入密码" required>
          <button type="button" class="eye" data-for="uPass">👁</button>
        </div>
      </div>
      <button type="submit" id="loginBtn">登 录</button>
      <div class="msg" id="loginMsg"></div>
    </form>

    <form class="pane" id="registerPane" hidden>
      <div class="field">
        <label>账号</label>
        <input id="rName" autocomplete="username" placeholder="3 个字符以上" required>
      </div>
      <div class="field">
        <label>昵称（可选）</label>
        <input id="rNick" placeholder="显示用的名字">
      </div>
      <div class="field">
        <label>密码</label>
        <div class="pw-wrap">
          <input id="rPass" type="password" autocomplete="new-password" placeholder="至少 6 位" required>
          <button type="button" class="eye" data-for="rPass">👁</button>
        </div>
      </div>
      <div class="field">
        <label>确认密码</label>
        <div class="pw-wrap">
          <input id="rPass2" type="password" autocomplete="new-password" placeholder="再输入一次" required>
          <button type="button" class="eye" data-for="rPass2">👁</button>
        </div>
      </div>
      <button type="submit" id="regBtn">注 册</button>
      <div class="msg" id="regMsg"></div>
    </form>
  </div>

  <p class="foot">测试账号 test01 / 123456<span>·</span>无法登录？联系管理员</p>
</div>

<script type="module">
import { currentUser, login, register } from "./src/api.js";

if (currentUser()) location.replace("./index.html");

const tabs = document.querySelectorAll(".tab");
const loginPane = document.getElementById("loginPane");
const registerPane = document.getElementById("registerPane");

tabs.forEach(t => t.addEventListener("click", () => {
  tabs.forEach(x => x.classList.toggle("active", x === t));
  const isLogin = t.dataset.tab === "login";
  loginPane.hidden = !isLogin;
  registerPane.hidden = isLogin;
}));

document.querySelectorAll(".eye").forEach(btn => {
  btn.addEventListener("click", () => {
    const inp = document.getElementById(btn.dataset.for);
    const show = inp.type === "password";
    inp.type = show ? "text" : "password";
    btn.textContent = show ? "🙈" : "👁";
  });
});

loginPane.addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("loginMsg");
  const btn = document.getElementById("loginBtn");
  const name = document.getElementById("uName").value.trim();
  const pass = document.getElementById("uPass").value;
  if (!name || !pass) { msg.textContent = "请输入账号和密码"; return; }

  btn.disabled = true;
  msg.className = "msg";
  msg.textContent = "登录中…";
  try {
    const u = await login(name, pass);
    msg.className = "msg ok";
    msg.textContent = `欢迎 ${u.nick_name || u.username}`;
    setTimeout(() => location.replace("./index.html"), 400);
  } catch (err) {
    msg.textContent = err.message || "登录失败";
    btn.disabled = false;
  }
});

registerPane.addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("regMsg");
  const btn = document.getElementById("regBtn");
  const name = document.getElementById("rName").value.trim();
  const nick = document.getElementById("rNick").value.trim();
  const p1 = document.getElementById("rPass").value;
  const p2 = document.getElementById("rPass2").value;

  if (name.length < 3) { msg.textContent = "账号至少 3 个字符"; return; }
  if (p1.length < 6) { msg.textContent = "密码至少 6 位"; return; }
  if (p1 !== p2) { msg.textContent = "两次输入的密码不一致"; return; }

  btn.disabled = true;
  msg.className = "msg";
  msg.textContent = "注册中…";
  try {
    await register(name, p1, nick);
    msg.className = "msg ok";
    msg.textContent = "注册成功，正在登录…";
    await login(name, p1);
    setTimeout(() => location.replace("./index.html"), 500);
  } catch (err) {
    msg.textContent = err.message || "注册失败";
    btn.disabled = false;
  }
});
</script>
</body>
</html>
